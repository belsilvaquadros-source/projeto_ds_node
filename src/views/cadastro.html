
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Sistema Escolar</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <div class="card cadastro">

        <h1>Sistema Escolar</h1>

        <h2>Cadastro de Usuário</h2>

        <form id="formCadastro">

            <label>Nome completo</label>

            <input
                type="text"
                id="nome"
                maxlength="100"
                required
            >

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                maxlength="100"
                required
            >

            <label>Telefone</label>

            <input
                type="text"
                id="telefone"
                placeholder="(00) 00000-0000"
                maxlength="15"
            >

            <hr>

            <h3>Endereço</h3>

            <label>CEP</label>

            <input
                type="text"
                id="cep"
                placeholder="00000-000"
                maxlength="9"
                required
            >

            <label>Endereço</label>

            <input
                type="text"
                id="endereco"
                maxlength="150"
            >

            <label>Número</label>

            <input
                type="text"
                id="numero"
                maxlength="10"
                required
            >

            <label>Complemento</label>

            <input
                type="text"
                id="complemento"
                maxlength="100"
            >

            <label>Bairro</label>

            <input
                type="text"
                id="bairro"
                maxlength="100"
            >

            <label>Cidade</label>

            <input
                type="text"
                id="cidade"
                maxlength="100"
            >

            <label>Estado</label>

            <input
                type="text"
                id="estado"
                maxlength="2"
                placeholder="SP"
            >

            <hr>

            <h3>Acesso</h3>

            <label>Login</label>

            <input
                type="text"
                id="login"
                maxlength="50"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                maxlength="255"
                minlength="6"
                required
            >

            <label>Confirme a senha</label>

            <input
                type="password"
                id="confirmacaoSenha"
                maxlength="255"
                minlength="6"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p id="mensagem"></p>

        <a href="/">
            Voltar para o login
        </a>

    </div>

    <script src="/js/cadastro.js"></script>

</body>

</html>
