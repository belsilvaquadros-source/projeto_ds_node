<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle de Usuários - Sistema Escolar</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <div class="card cadastro">

        <h1>Sistema Escolar</h1>

        <h2>CONTROLE DE USUÁRIOS</h2>

        <button
            type="button"
            id="btnSair">
            Sair do sistema
        </button>

        <hr>

        <h3>Usuários cadastrados</h3>

        <p id="mensagem"></p>

        <div style="overflow-x: auto;">

            <table border="1"
                   cellpadding="8"
                   cellspacing="0"
                   width="100%">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Login</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="listaUsuarios"></tbody>

            </table>

        </div>

        <hr>

        <form id="formEdicao" hidden>

            <h3>Editar usuário</h3>

            <input
                type="hidden"
                id="idUsuario"
            >

            <label>Nome completo</label>

            <input
                type="text"
                id="nome"
                maxlength="100"
                required
            >

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                maxlength="100"
                required
            >

            <label>Telefone</label>

            <input
                type="text"
                id="telefone"
                maxlength="20"
            >

            <label>CEP</label>

            <input
                type="text"
                id="cep"
                maxlength="9"
            >

            <label>Endereço</label>

            <input
                type="text"
                id="endereco"
                maxlength="150"
            >

            <label>Número</label>

            <input
                type="text"
                id="numero"
                maxlength="10"
            >

            <label>Complemento</label>

            <input
                type="text"
                id="complemento"
                maxlength="100"
            >

            <label>Bairro</label>

            <input
                type="text"
                id="bairro"
                maxlength="100"
            >

            <label>Cidade</label>

            <input
                type="text"
                id="cidade"
                maxlength="100"
            >

            <label>Estado</label>

            <input
                type="text"
                id="estado"
                maxlength="2"
            >

            <label>Login</label>

            <input
                type="text"
                id="login"
                maxlength="50"
                required
            >

            <label>Nova senha (opcional)</label>

            <input
                type="password"
                id="senha"
                maxlength="255"
                minlength="6"
                placeholder="Deixe vazio para manter a senha atual"
            >

            <button type="submit">
                Salvar alterações
            </button>

            <button
                type="button"
                id="btnCancelar">
                Cancelar
            </button>

        </form>

    </div>

    <script src="/js/controle-usuarios.js"></script>

</body>

</html>
